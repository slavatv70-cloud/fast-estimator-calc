name: Build Calculator EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Позволяет запускать сборку вручную кнопки

jobs:
  build:
    runs-on: windows-latest # Собираем на Windows, чтобы получить .exe

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 openpyxl pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --name="Estimator_Calculator" calculator.py

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Calculator-Windows-EXE
        path: dist/Estimator_Calculator/
