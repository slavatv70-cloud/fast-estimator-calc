name: Build Calculator EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 openpyxl pyinstaller autopep8

    - name: Auto-fix Python Indentation (Tabs and Spaces)
      run: |
        autopep8 --in-place --select=E101,E121,E122,E123,E124,E125,E126,E127,E128,W191 calculator.py

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --name="Estimator_Calculator" calculator.py

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Calculator-Windows-EXE
        path: dist/Estimator_Calculator/
